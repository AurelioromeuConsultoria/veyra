# Veyra — STAGING, como RECURSO DO COOLIFY (ADR-046)
#
# A VPS é gerenciada por Coolify 4.3.11 (~40 containers, Traefik v3.6 dono de
# 80/443), e a decisão da operação é que o Veyra entre pelo mesmo caminho que o
# resto da casa. Consequências desta escolha, todas visíveis abaixo:
#
#   · SEM `name:` — o Coolify define o nome do projeto e prefixa os recursos.
#   · SEM labels de Traefik e SEM a rede do proxy: quem gera as labels e conecta
#     o container à rede é o Coolify, a partir do domínio configurado no painel.
#     Manter as minhas produziria DUAS regras para o mesmo host, e a que vence
#     depende da ordem de leitura do Traefik.
#   · SEM `env_file`: as variáveis vêm do painel (ver ADR-046 e §3 do runbook).
#   · NENHUMA porta publicada — o Traefik alcança o `web` pela rede que o
#     próprio Coolify cria.
#
# Para rodar por compose puro (fora do Coolify), veja a §11 do runbook: são
# três acréscimos, e o arquivo continua servindo aos dois modos.
#
# Runbook completo: docs/DEPLOY_STAGING.md

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

x-restart: &restart unless-stopped

services:
  # ── entrada: SPA + /api pela rede interna ─────────────────────────────────
  web:
    image: ${VEYRA_IMAGE_WEB:-veyra/web:staging}
    build:
      # RAIZ DO REPOSITÓRIO. O Coolify roda o compose com `--project-directory`
      # na raiz do clone, então caminho relativo se resolve A PARTIR DELA — não
      # da pasta deste arquivo. `../..` saía do repositório e o build falhava
      # com "Dockerfile not found". Localmente, use `--project-directory .`
      # (ver §9 do runbook).
      context: .
      dockerfile: apps/web/Dockerfile
    restart: *restart
    logging: *logging
    depends_on:
      api:
        condition: service_healthy
    networks: [veyra]
    environment:
      # O COOLIFY LÊ ESTA VARIÁVEL: é dela que ele deriva o domínio, gera as
      # labels do Traefik e emite o certificado. Configure-a no painel, no
      # serviço `web`. Nenhuma label de Traefik aqui — ver o cabeçalho.
      SERVICE_FQDN_WEB_8080: ${SERVICE_FQDN_WEB_8080:-}
    # Sem `ports`: quem publica 80/443 é o Traefik do Coolify.
    expose: ['8080']
    security_opt: ['no-new-privileges:true']

  # ── API + jobs no mesmo processo (pg-boss, ADR-007) ───────────────────────
  api:
    image: ${VEYRA_IMAGE_API:-veyra/api:staging}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: *restart
    logging: *logging
    environment:
      # No modo Coolify, TODAS as variáveis abaixo (e os segredos) vêm do painel
      # — ele as injeta no container. Em compose puro, use `env_file` (§11 do
      # runbook). O `${...}` sem default é deliberado: variável ausente vira
      # erro visível no deploy, não string vazia silenciosa.
      NODE_ENV: production
      PORT: '3001'
      # dentro da rede do projeto: nomes de serviço, nunca IP
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # vazio quando o perfil `scanner` não está ligado: `env.ts` trata string
      # vazia como ausência, e a aplicação sobe sem scanner
      CLAMAV_HOST: ${CLAMAV_HOST-}
      CLAMAV_PORT: '3310'
      STORAGE_ROOT: /data/storage
      WEB_ORIGIN: https://${VEYRA_HOST}
      # kill switch dos jobs (worker do outbox, varreduras, reconciliação): o
      # deploy da guarda sobe o código novo com `true` até as migrations
      # (DEPLOY_STAGING §4). Fora disso, `false`.
      DISABLE_JOBS: ${DISABLE_JOBS:-false}
      # a barreira de manutenção (ADR-053): OBRIGATÓRIA e SEM padrão — ausente,
      # o compose recusa; um padrão silencioso desligaria a barreira por esquecimento
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:?MAINTENANCE_MODE é obrigatória (true ou false; ADR-053)}
    depends_on:
      db:
        condition: service_healthy
      # ClamAV NÃO entra em `depends_on`: ele é opcional (perfil `scanner`), e
      # depender de um serviço que pode não existir travaria a subida da API.
      # Sem scanner o arquivo fica `pending` e não sai para canal externo
      # (ADR-043) — a ausência degrada para o seguro.
    volumes:
      - storage:/data/storage
    tmpfs:
      - /tmp:size=256m,mode=1777
    networks: [veyra]
    security_opt: ['no-new-privileges:true']

  db:
    image: postgres:17-alpine
    restart: *restart
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # `initdb` com checksums: corrupção silenciosa de página vira erro
      POSTGRES_INITDB_ARGS: '--data-checksums'
    # SEM `ports`: o banco só existe dentro da rede do projeto. O VerboPlus
    # tem Postgres com porta pública nesta mesma VPS; não repetimos isso.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [veyra]
    security_opt: ['no-new-privileges:true']

  # OPCIONAL por decisão de capacidade: a VPS tem 7,8 GB com ~4,0 GB
  # disponíveis e 1,4 GB de swap já em uso; o ClamAV pede 1,5–2 GB residentes.
  # Sem scanner, todo arquivo fica `pending` e NÃO sai para canal externo — a
  # degradação segura do ADR-043, que em staging não custa nada.
  # Para ligar:  docker compose --profile scanner up -d
  clamav:
    image: clamav/clamav:1.4
    profiles: ['scanner']
    restart: *restart
    logging: *logging
    volumes:
      # sem isto, cada recriação rebaixa a base inteira de assinaturas
      - clamav:/var/lib/clamav
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 60s
      timeout: 10s
      retries: 10
      # o primeiro boot baixa a base e leva minutos
      start_period: 600s
    networks: [veyra]
    security_opt: ['no-new-privileges:true']

  # ── backup: banco + storage para destino externo ──────────────────────────
  backup:
    image: ${VEYRA_IMAGE_BACKUP:-veyra/backup:staging}
    build:
      context: deploy/staging/backup
    restart: *restart
    logging: *logging
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_AT: ${BACKUP_AT:-03:15}
      # destino e cifra do backup vêm do painel, como o resto dos segredos
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # somente leitura: o backup não tem por que escrever no storage
      - storage:/data/storage:ro
      - restic-cache:/home/veyra/.cache/restic
    networks: [veyra]
    security_opt: ['no-new-privileges:true']

networks:
  # rede interna do projeto. SEM `name:` fixo e SEM faixa fixa: no modo Coolify
  # quem nomeia e endereça é ele, e impor os dois criaria colisão com o que o
  # painel já gerencia. Em compose puro, veja a §11 do runbook.
  veyra:
    driver: bridge

# Volumes NOMEADOS (sem `name:` fixo): o Coolify os prefixa com o id do
# recurso, o que é justamente o que garante que não colidam com os ~40
# containers vizinhos. Os nomes reais aparecem no painel e em `docker volume ls`
# depois do primeiro deploy — anote-os no runbook de restauração.
volumes:
  pgdata:
  storage:
  clamav:
  restic-cache:
