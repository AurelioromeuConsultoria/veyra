# Container de ENTRADA do Veyra. Escuta só na rede interna do projeto — nunca
# publica 80/443 e, portanto, não disputa nada com o proxy da VPS.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8080;
  server_name _;

  # o proxy da frente já registra; aqui só o que ajuda a depurar upstream
  access_log /var/log/nginx/access.log combined;

  # saúde do próprio container de entrada: não toca a API, responde sempre
  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # ── API ───────────────────────────────────────────────────────────────────
  # Nada de reescrever o caminho: a API monta tudo sob `/api`, inclusive o
  # webhook da Meta. E nada de mexer no corpo: a assinatura HMAC do webhook é
  # calculada sobre os BYTES exatos — qualquer transformação a invalidaria.
  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # o proxy da VPS acrescenta a origem real; preservamos a cadeia para o
    # rate limit por IP e para a auditoria não registrarem o IP do container
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_request_buffering off;
    client_max_body_size 25m;   # teto de upload do produto é 10 MB; folga p/ multipart
    # acima da geração de IA SOB A GUARDA de uso externo (ADR-047 adendo 7 §9):
    # espera por sessão, travas, reconferência e registro, os 60 s do provedor,
    # a desistência e a persistência — o orçamento passa de 98 s com um contato.
    # Cortar antes devolveria 504 com o run gravado e cobrado, e a pessoa pagaria
    # de novo ao repetir
    proxy_read_timeout 120s;
  }

  # ── SPA ───────────────────────────────────────────────────────────────────
  root /usr/share/nginx/html;
  index index.html;

  # assets com hash no nome: cache longo e imutável
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # o HTML NUNCA é cacheado: é ele que aponta para os assets da versão nova
  location / {
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }
}
