name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Entrega 3: lint, typecheck/build, testes unit+integração (P0 de isolamento)
# + check:fk, e E2E Playwright (banco próprio veyra_e2e). Build Docker entra
# em entrega futura (docs/ROADMAP.md).
jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @veyra/api prisma:generate
      - run: pnpm lint
      - run: pnpm format:check

  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: veyra
          POSTGRES_PASSWORD: veyra_ci
          POSTGRES_DB: veyra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veyra" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://veyra:veyra_ci@localhost:5432/veyra
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @veyra/api prisma:generate
      - run: pnpm --filter @veyra/api prisma:deploy
      - run: pnpm build

  test:
    name: Testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: veyra
          POSTGRES_PASSWORD: veyra_ci
          POSTGRES_DB: veyra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veyra" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://veyra:veyra_ci@localhost:5432/veyra_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @veyra/contracts build
      - run: pnpm --filter @veyra/api prisma:generate
      - run: pnpm --filter @veyra/api test
      - run: pnpm --filter @veyra/api test:integration
      - name: seed do catálogo de permissões (contra o banco de teste migrado)
        run: pnpm --filter @veyra/api prisma:seed
        env:
          DATABASE_URL: postgresql://veyra:veyra_ci@localhost:5432/veyra_test
      - name: check:fk (valida o SCHEMA; scan de dados vale contra staging/prod)
        run: pnpm --filter @veyra/api check:fk
        env:
          DATABASE_URL: postgresql://veyra:veyra_ci@localhost:5432/veyra_test
      - run: pnpm --filter @veyra/web test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: veyra
          POSTGRES_PASSWORD: veyra_ci
          POSTGRES_DB: veyra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veyra" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://veyra:veyra_ci@localhost:5432/veyra_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @veyra/api prisma:generate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
