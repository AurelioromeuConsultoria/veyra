name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No PR, o run novo cancela o anterior. Na `main`, cada push roda inteiro: um
# run cancelado no meio do deploy deixaria o staging sem a conferência do commit
# publicado (ADR-058); quem serializa os deploys é o job `Staging`.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Entrega 3: lint, typecheck/build, testes unit+integração (P0 de isolamento)
# + check:fk, e E2E Playwright (banco próprio veyra_e2e). Build Docker entra
# em entrega futura (docs/ROADMAP.md).
jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @veyra/api prisma:generate
      - run: pnpm lint
      - run: pnpm format:check

  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: veyra
          POSTGRES_PASSWORD: veyra_ci
          POSTGRES_DB: veyra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veyra" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://veyra:veyra_ci@localhost:5432/veyra
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @veyra/api prisma:generate
      - run: pnpm --filter @veyra/api prisma:deploy
      - run: pnpm build

  # Os testes de integração rodam em série (um banco, truncado entre casos) e
  # eram o caminho crítico do CI (~12 min). Divididos em partes, cada uma num
  # runner com o SEU Postgres: o isolamento entre testes não muda (ADR-058,
  # adendo 1). Unitários, web, seed e check:fk rodam uma vez, na parte 1.
  test:
    name: Testes (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: veyra
          POSTGRES_PASSWORD: veyra_ci
          POSTGRES_DB: veyra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veyra" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://veyra:veyra_ci@localhost:5432/veyra_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @veyra/contracts build
      - run: pnpm --filter @veyra/api prisma:generate
      - run: pnpm --filter @veyra/api test
        if: matrix.shard == 1
      - run: pnpm --filter @veyra/api test:integration --shard=${{ matrix.shard }}/4
      - name: seed do catálogo de permissões (contra o banco de teste migrado)
        if: matrix.shard == 1
        run: pnpm --filter @veyra/api prisma:seed
        env:
          DATABASE_URL: postgresql://veyra:veyra_ci@localhost:5432/veyra_test
      - name: check:fk (valida o SCHEMA; scan de dados vale contra staging/prod)
        if: matrix.shard == 1
        run: pnpm --filter @veyra/api check:fk
        env:
          DATABASE_URL: postgresql://veyra:veyra_ci@localhost:5432/veyra_test
      - run: pnpm --filter @veyra/web test
        if: matrix.shard == 1

  # O E2E também em partes, cada uma com o seu Postgres e a sua pilha
  # (ADR-058, adendo 1): os specs já não dependem da ordem entre arquivos.
  e2e:
    name: E2E (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: veyra
          POSTGRES_PASSWORD: veyra_ci
          POSTGRES_DB: veyra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veyra" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://veyra:veyra_ci@localhost:5432/veyra_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @veyra/api prisma:generate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm exec playwright test --shard=${{ matrix.shard }}/2

  # ADR-058: a entrega publicada vai ao staging DEPOIS dos quatro jobs verdes.
  # O Auto Deploy do Coolify fica em "Manual deployments only"; quem publica é
  # este job, pela API, com um token só de `read` e `deploy`, guardado nos
  # secrets do ambiente `staging` (restrito à `main`). Com migration, variável
  # exigida ou mudança na pilha, ele não publica (DEPLOY_STAGING §4.1).
  # A ponta, fora do grupo dos deploys: só o commit que ainda é a ponta da `main`
  # entra na fila de `staging-deploy`. Lá dentro, um job pendente substitui o
  # anterior, e um run mais velho que chegasse depois cancelaria o da ponta.
  staging-ponta:
    name: Staging (ponta)
    needs: [lint, build, test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      publicar: ${{ steps.ponta.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4
      - id: ponta
        name: Confere se o commit ainda é a ponta da main
        run: |
          ponta=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ -n "$ponta" ] && [ "$ponta" = "$GITHUB_SHA" ]; then
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::a main já está em ${ponta:-?}; o run do commit novo publica depois do CI dele"
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          fi

  staging:
    name: Staging
    needs: [staging-ponta]
    if: needs.staging-ponta.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: staging
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      # o registro das publicações conferidas (o ambiente `staging-conferido`)
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publica o commit testado no staging
        run: bash .github/scripts/staging-deploy.sh
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          STAGING_URL: https://veyra-staging.malachdigital.com.br
          SHA: ${{ github.sha }}
          STAGING_BASE: ${{ vars.STAGING_BASE }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
